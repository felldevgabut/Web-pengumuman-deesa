<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

</head>
<body>
    
    <div class="fcontainer">
        <div class="form">
            <div class="judul">
                <h3>Selamat Datang Admin<br>Lingkungan IV</h3>
            </div>
            
            <form id="loginForm">
                <label>Username</label> 
                <br>
                <input type="text" id="username" placeholder="Masukan username anda" required>
                <br><br>
                <label>Password</label>
                <br>
                <input type="password" id="password" placeholder="Masukan password anda" required>
                <br><br>
                <a class="tombol" id="loginBtn" href="#">Masuk</a>
            </form>
        </div>
    </div>
    <script src="login.js"></script>
</body>
</html>
